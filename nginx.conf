server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: this is a client-side-routed React app. A request for
    # /dashboard has no matching file on disk, so serve index.html and let
    # react-router resolve the route. Mirrors the vercel.json rewrite.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
